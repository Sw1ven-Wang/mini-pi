# ============================================================
#  pyproject.toml —— 项目元数据与工具配置（TOML 格式）
#  `#` 开头的行都是注释，不影响程序运行，仅用于解释说明。
# ============================================================

# ------------------------------------------------------------
# [project] —— 项目本身的描述信息（名称、版本、依赖等）
# 这些字段会被 pip / 构建工具读取，用于打包和安装。
# ------------------------------------------------------------
[project]
name = "mini-pi"                          # 包名，安装后导入时使用
version = "0.1.0"                         # 当前版本号（语义化版本：主.次.修订）
description = "A minimal Python agent harness inspired by Pi"  # 一句话项目简介
requires-python = ">=3.11"                # 要求 Python 版本不低于 3.11

# dependencies —— 运行本项目必需的第三方库
# 写法 "库名>=版本号" 表示：安装该库，且版本必须 >= 指定版本
dependencies = [
    "openai>=3.2.0",
    "pydantic>=2.0",   # 数据校验/模型库，用于定义结构化数据
]

# ------------------------------------------------------------
# [project.optional-dependencies] —— 可选依赖分组
# 默认 `pip install .` 不会装这些，需用 `pip install .[dev]` 显式安装
# ------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=8.0",          # 单元测试框架
    "pytest-asyncio>=0.23", # pytest 的异步插件，支持测试 async 函数
]

# ------------------------------------------------------------
# [build-system] —— 打包/构建工具配置
# 告诉 pip 用什么后端（backend）以及用什么工具来构建这个包
# ------------------------------------------------------------
[build-system]
requires = ["setuptools>=68"]             # 构建所需的工具及版本
build-backend = "setuptools.build_meta"   # 实际执行构建的后端

# ------------------------------------------------------------
# [tool.pytest.ini_options] —— pytest 测试框架的配置
# 这些选项会被 pytest 自动读取（相当于 pytest.ini 里的内容）
# ------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"   # 自动处理 async 测试，无需手动写装饰器
addopts = "--basetemp=.tmp -v"  # 指定临时目录
[tool.uv.workspace]
members = [
    "mini-pi",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
#告诉 uv 这只是一个应用项目，不需要打包自己
[tool.uv]
package = false

