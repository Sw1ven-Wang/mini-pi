name: V11.1 runtime regression
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_l2:
        description: Run opt-in Docker and Podman isolation tests
        type: boolean
        default: false
      l2_image:
        description: Python+Bash image pinned as repository@sha256:digest (required for L2)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: v111-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv and frozen Python dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --group dev
      - name: Python offline regression (real models remain opt-in)
        run: uv run python -m pytest tests -q --basetemp=.tmp_ci --junitxml=python-results.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend regression and build
        run: |
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web run test
          npm --prefix web run build
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Install Windows visual baseline browser
        if: runner.os == 'Windows'
        working-directory: web
        run: npx playwright install msedge
      - name: Real HTTP and process-restart E2E (Fake Provider only)
        run: npm --prefix web run test:e2e:integration
      - name: UI and responsive visual regression
        run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v111-offline-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            python-results.xml
            web/test-results
          retention-days: 7
  l2:
    if: github.event_name == 'workflow_dispatch' && inputs.run_l2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      RUN_CONTAINER_SANDBOX_TESTS: '1'
      MINI_PI_L2_IMAGE: ${{ inputs.l2_image }}
      L2_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen Python dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --group dev
      - name: Install Podman
        if: matrix.engine == 'podman'
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Validate runtime and pull digest-pinned image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MINI_PI_L2_IMAGE" =~ ^[A-Za-z0-9._:/-]+@sha256:[0-9a-fA-F]{64}$ ]]
          command -v "$L2_ENGINE"
          "$L2_ENGINE" info
          "$L2_ENGINE" pull "$MINI_PI_L2_IMAGE"
      - name: Explicit L2 security tests (not Fake Provider metrics)
        run: uv run python -m pytest tests/security/test_v10_container_runtime.py -q -k "${{ matrix.engine }}" --junitxml=l2-results.xml
      - name: Reject skipped L2 cases
        if: always()
        run: |
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('l2-results.xml'); cases=r.findall('.//testcase'); assert len(cases)==3 and not r.findall('.//skipped') and not r.findall('.//failure') and not r.findall('.//error'), 'L2 gate must execute all 3 cases without skips'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v111-l2-${{ matrix.engine }}
          path: l2-results.xml
          retention-days: 7
